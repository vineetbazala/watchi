<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Watchi{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hero.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lightmode.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detail.css')}}?v=5">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile-widget.css') }}">
</head>
<body>

<div class="topbar">
    <nav>
        <a href="/" class="{{ 'active' if active_page == 'home' }}">Home</a>
        <a href="/movies" class="{{ 'active' if active_page == 'movies' }}">Movies</a>
        <a href="/series" class="{{ 'active' if active_page == 'series'}}">Shows</a>
        <a href="/add" class="{{ 'active' if active_page == 'add' }}">Add</a>
        <a href="/search" class="{{ 'active' if active_page == 'search' }}">Search</a>
        <a href="/watchlist" class="{{ 'active' if active_page == 'watchlist' }}">Watchlist</a>
        <a href="/statistics" class="{{ 'active' if active_page == 'stats' }}">Stats</a>
        <a href="/toprated" class="{{ 'active' if active_page == 'toprated' }}">Top Rated</a>
        <a href="/foryou" class="{{ 'active' if active_page == 'foryou' }}">For You</a>
        <button onclick="toggleMode()" id="mode-btn"
            style="background:none; border:1px solid var(--border);
            color:var(--text); padding:6px 14px; width:auto;
            font-size:12px; border-radius:50px;">
                ☀️
        </button>
    </nav>

    {% include "_profile_widget.html" %}
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
function toggleFavorite(event, btn, endpoint, fieldName, value) {
    event.preventDefault();
    event.stopPropagation();

    fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `${fieldName}=${encodeURIComponent(value)}`
    })
    .then(r => {
        if (!r.ok) throw new Error(`Server responded ${r.status}`);
        return r.json();
    })
    .then(data => {
        if (data.success) {
            btn.classList.toggle("is-fav", data.is_favorite);
            btn.classList.remove("fav-pop");
            void btn.offsetWidth;
            btn.classList.add("fav-pop");
            showFavToast(data.is_favorite ? "Added to Favorites" : "Removed from Favorites");
        } else {
            console.error("Favorite toggle failed:", data);
        }
    })
    .catch(err => console.error("Favorite toggle error:", err));
}

function showFavToast(message) {
    const toast = document.createElement("div");
    toast.className = "fav-toast";
    toast.textContent = message;
    document.body.appendChild(toast);

    requestAnimationFrame(() => toast.classList.add("show"));

    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
    }, 1600);
}
</script>

<script>
function toggleMode() {
    document.body.classList.toggle("light-mode");
    const btn = document.getElementById("mode-btn");
    btn.textContent = document.body.classList.contains("light-mode") ? "🌙" : "☀️";
    localStorage.setItem("mode", document.body.classList.contains("light-mode") ? "light" : "dark");
}

if (localStorage.getItem("mode") === "light") {
    document.body.classList.add("light-mode");
    document.getElementById("mode-btn").textContent = "🌙";
}
</script>

<script>
document.querySelectorAll('.movie-card').forEach(card => {

    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();

        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;

        const rotateX = -(y / rect.height) * 8;
        const rotateY = (x / rect.width) * 8;

        card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-3px)`;
    });

    card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) translateY(0)';
        card.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
    });

    card.addEventListener('mouseenter', () => {
        card.style.transition = 'none'; // instant follow during hover
    });
});
</script>

{% with messages = get_flashed_messages() %}
  {% if messages %}
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        showToast({{ messages[0]|tojson }});
    });
  </script>
  {% endif %}
{% endwith %}

<script>
function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;

    const text = message.toLowerCase();
    if (text.includes("removed") || text.includes("delete")) {
        toast.classList.add("toast--delete");
    } else if (text.includes("updated") || text.includes("moved")) {
        toast.classList.add("toast--update");
    } else if (text.includes("added")) {
        toast.classList.add("toast--added");
    }

    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add("show"));

    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
    }, 1600);
}
</script>

<script>
// ── Scroll Reveal ──────────────────────────
const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            revealObserver.unobserve(entry.target);
        }
    });
}, {
    threshold: 0.12,
    rootMargin: '0px 0px -40px 0px'
});

document.querySelectorAll('.reveal').forEach(el => {
    revealObserver.observe(el);
});
</script>

<!-- Page transition loader — shows a full-screen spinner the instant a
     movie/show link is clicked, since the detail routes block on OMDB/TMDb
     calls before any HTML is sent. Removed automatically when the new
     page (and this markup) loads fresh. -->
<div id="pageLoader" style="position:fixed;inset:0;background:#08080a;z-index:9999;display:none;align-items:center;justify-content:center;">
  <div style="width:44px;height:44px;border:3px solid rgba(255,255,255,0.15);border-top-color:#e8c98d;border-radius:50%;animation:pageLoaderSpin 0.8s linear infinite;"></div>
</div>
<style>
@keyframes pageLoaderSpin { to { transform: rotate(360deg); } }
</style>
<script>
document.querySelectorAll('a[href^="/movie/"], a[href^="/show/"], a[href="/foryou"]').forEach(function(link) {
    link.addEventListener('click', function() {
        document.getElementById('pageLoader').style.display = 'flex';
    });
});
</script>

</body>
</html>
