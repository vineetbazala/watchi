{% extends "base.html" %}
{% block title %}Sign in — Watchi{% endblock %}
{% block content %}
<style>
  .login-stage{
    position: relative;
    min-height: 78vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border-radius: 24px;
    margin-top: 8px;
  }

  /* ambient color glow — drifts slowly, works in both light and dark mode
     since it sits under a translucent scrim tied to --bg */
  .login-glow{
    position: absolute; inset: -10%;
    background:
      radial-gradient(circle at 20% 25%, rgba(200,169,110,0.35), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(100,149,237,0.28), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(147,112,219,0.22), transparent 50%);
    filter: blur(60px);
    animation: loginDrift 18s ease-in-out infinite alternate;
  }
  @keyframes loginDrift{
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.08); }
  }
  .login-scrim{
    position: absolute; inset: 0;
    background: var(--bg, #0d0d0f);
    opacity: 0.72;
  }

  .login-card{
    position: relative; z-index: 2;
    width: 100%; max-width: 380px;
    padding: 40px 34px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 20px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.5);
    transform: translateY(16px); opacity: 0;
    animation: loginRise .6s cubic-bezier(0.16,1,0.3,1) .1s forwards;
  }
  @keyframes loginRise{ to{ transform: translateY(0); opacity: 1; } }

  .login-card h1{ font-size: 24px; font-weight: 800; margin-bottom: 6px; color: var(--text, #f2f1ee); }
  .login-card p{ font-size: 13px; color: var(--text-muted, #9a9a9f); margin-bottom: 30px; }

  .login-field{ margin-bottom: 18px; }
  .login-field label{
    display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-muted, #9a9a9f); margin-bottom: 7px;
  }
  .login-field input{
    width: 100%; padding: 13px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--text, #f2f1ee); font-family: inherit; font-size: 14px;
    transition: border-color .2s, background .2s;
  }
  .login-field input::placeholder{ color: rgba(255,255,255,0.3); }
  .login-field input:focus{ outline: none; border-color: #c8a96e; background: rgba(255,255,255,0.1); }

  .login-btn{
    width: 100%; padding: 14px; margin-top: 8px;
    border-radius: 50px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #e8c98d, #c8a96e);
    color: #16130c; font-weight: 700; font-size: 14px;
    box-shadow: 0 8px 24px rgba(200,169,110,0.3);
    transition: transform .2s cubic-bezier(0.4,0,0.2,1), box-shadow .2s;
  }
  .login-btn:hover{ transform: translateY(-2px); box-shadow: 0 12px 30px rgba(200,169,110,0.45); }
  .login-btn:active{ transform: translateY(0) scale(0.98); }

  @media (max-width: 480px){
    .login-card{ margin: 0 16px; padding: 32px 24px; }
  }
</style>

<div class="login-stage">
  <div class="login-glow"></div>
  <div class="login-scrim"></div>

  <div class="login-card">
    <h1>Welcome back</h1>
    <p>Sign in to your Watchi collection.</p>
    <form method="POST">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="your username" required autofocus>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
